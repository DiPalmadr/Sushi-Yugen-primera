<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Sushi Yugen</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&family=Space+Grotesk:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet"><style>@font-face{font-family:'CustomFont_1790181491202';src:url('fonts/font_propia.ttf');}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px;background:#fff;color:#1a1a1a;font-family:"Space Grotesk", sans-serif;text-align:center}#lp-espera{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:420px}.lg{max-width:220px;max-height:180px;object-fit:contain}.sp{width:60px;height:60px;border:5px solid #e5e5e5;border-top-color:#25D366;border-radius:50%;animation:s .9s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.ok{display:none;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;font-size:34px;line-height:60px}.t{font-size:21px;font-weight:600;line-height:1.3}.n{font-size:46px;font-weight:700;color:#25D366;display:none}.s{font-size:15px;color:#777}</style></head><body><div id="lp-espera"><img class="lg" alt="" src="espera-img.webp"><div class="sp" id="sp"></div><div class="ok" id="ok">✓</div><div class="t" id="t">Estamos preparando tu orden…</div><div class="n" id="n"></div><div class="s" id="s">Un momento, por favor</div></div><script>var hecho=false;
function irA(u){location.replace(u);}
function leer(){
 if(hecho)return;
 var h=location.hash||"";
 if(h.length<2)return;
 var o="",u="",partes=h.slice(1).split("&");
 for(var i=0;i<partes.length;i++){
  var kv=partes[i],ix=kv.indexOf("="),k=ix<0?kv:kv.slice(0,ix),v=ix<0?"":kv.slice(ix+1);
  try{v=decodeURIComponent(v);}catch(e){}
  if(k==="o")o=v;else if(k==="u")u=v;
 }
 if(u.indexOf("https://wa.me/")!==0)return;
 hecho=true;
 var num=parseInt(o,10);
 if(num>0){
  document.getElementById("sp").style.display="none";
  document.getElementById("ok").style.display="block";
  document.getElementById("t").textContent="¡Tu orden fue registrada!";
  var n=document.getElementById("n");n.textContent="Pedido #"+num;n.style.display="block";
  document.getElementById("s").textContent="Abriendo WhatsApp…";
  setTimeout(function(){irA(u);},1800);
 }else{
  document.getElementById("t").textContent="Abriendo WhatsApp…";
  setTimeout(function(){irA(u);},300);
 }
}
window.addEventListener("hashchange",leer);
leer();</script></body></html>
